name: GitHub Pages デプロイ

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: GitHub Pages をセットアップ
        uses: actions/configure-pages@v3

      - name: ファイルをアップロード
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v2
